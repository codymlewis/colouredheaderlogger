[project]
name = "colouredheaderlogs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ansicolors>=1.1.8",
]

[dependency-groups]
dev = [
    "isort>=6.0.1",
    "pyright>=1.1.400",
    "pytest>=8.3.5",
    "ruff>=0.11.8",
    "coverage>=7.10.2",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
addopts = "--doctest-modules --strict-markers"
testpaths = [
    "chl/*.py",
]
